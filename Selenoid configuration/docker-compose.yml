version: '3.7'

services:
  selenoid1:
    image: aerokube/selenoid:latest-release
    hostname: selenoid1
    networks:
      - selenoid1
    ports:
      - "4444:4444" 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /selenoid/browsers.json:/etc/selenoid/browsers.json:ro
    command: ["-container-network=selenoid1"]

  selenoid2:
    image: aerokube/selenoid:latest-release
    hostname: selenoid2
    networks:
      - selenoid2
    ports:
      - "4445:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /selenoid/browsers.json:/etc/selenoid/browsers.json:ro
    command: ["-container-network=selenoid2"]

  ggr:
    image: aerokube/ggr:latest
    hostname: ggr
    depends_on:
      - selenoid1
      - selenoid2
    networks:
      - selenoid1
      - selenoid2
    volumes:
      - /ggr/grid-router/:/etc/grid-router:ro
    command: ["-guests-allowed", "-guests-quota", "test", "-verbose"]

  ggr_ui:
    image: aerokube/ggr-ui:latest
    hostname: ggr_ui
    depends_on:
      - ggr
    networks:
      - selenoid1
      - selenoid2
    volumes:
      - /ggr/grid-router/quota/:/etc/grid-router/quota:ro
    ports:
      - 8888:8888 
    #command: ["-guests-allowed", "-guests-quota", "test", "-listen", ":8888"]

  selenoid_ui:
    image: aerokube/selenoid-ui:latest
    hostname: selenoid_ui
    networks:
      - selenoid1
    depends_on:
      - ggr_ui
    command: ["--selenoid-uri", "http://ggr_ui:8888"]
    ports:
      - 8080:8080  

  nginx:
    image: nginx
    hostname: nginx
    depends_on:
      - selenoid_ui
    networks:
      - selenoid1
    volumes:
      - /nginx/selenoid.conf:/etc/nginx/conf.d/selenoid.conf:ro
    ports:
      - 80:80

networks:
  selenoid1:
    name: selenoid1
  selenoid2:
    name: selenoid2

